<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>短链接服务</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #0969da;
      --line: #e0ddd6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 40px 24px 64px;
    }
    .wrap { width: 100%; max-width: 720px; }
    .card {
      padding: 32px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.01em; }
    .sub { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--accent); }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: opacity .15s;
    }
    button:hover { opacity: .9; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .result {
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.6;
      display: none;
    }
    .result.ok { display: block; background: #f0f7ff; border: 1px solid #cfe3ff; }
    .result.err { display: block; background: #fff5f5; border: 1px solid #ffd0d0; color: #b42318; }
    .result a { color: var(--accent); word-break: break-all; }

    .section {
      margin-top: 20px;
      padding: 24px 28px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-head h2 { margin: 0; font-size: 16px; }
    .btn-small {
      margin: 0;
      width: auto;
      padding: 6px 14px;
      font-size: 13px;
      background: #f0efec;
      color: var(--fg);
    }
    .btn-small:hover { background: #e6e4df; opacity: 1; }

    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
    tbody tr:last-child td { border-bottom: none; }
    td.code { width: 84px; }
    td.code a { color: var(--accent); text-decoration: none; font-weight: 600; }
    td.code a:hover { text-decoration: underline; }
    td.url {
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #444;
    }
    td.status { width: 72px; }
    .tag {
      display: inline-block;
      font-size: 11.5px;
      padding: 1px 8px;
      border-radius: 99px;
      background: #dcfce7;
      color: #15803d;
    }
    .tag.off { background: #fee2e2; color: #b91c1c; }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    .hint { margin-top: 24px; font-size: 12.5px; color: var(--muted); line-height: 1.9; text-align: center; }
    .hint code { background: #f0efec; padding: 1px 5px; border-radius: 4px; }
    .hint a { color: var(--accent); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <h1>短链接服务</h1>
    <p class="sub">输入长网址，生成一个更短的链接。</p>

    <input id="url" type="text" placeholder="https://example.com/very/long/path" autocomplete="off" autofocus>
    <button id="btn" type="button">生成短链</button>

    <div id="result" class="result"></div>
  </main>

  <section class="section">
    <div class="section-head">
      <h2>最近的短链</h2>
      <button id="refresh" class="btn-small" type="button">刷新</button>
    </div>
    <table>
      <thead>
      <tr>
        <th>短码</th>
        <th>原地址</th>
        <th>状态</th>
        <th>创建时间</th>
      </tr>
      </thead>
      <tbody id="list">
      <tr><td colspan="4" class="empty">加载中…</td></tr>
      </tbody>
    </table>
  </section>

  <p class="hint">
    接口文档：<a href="/swagger-ui/index.html">/swagger-ui/index.html</a>　·　
    短链跳转：<code>GET /{code}</code>　·　创建接口：<code>POST /api/links</code>
  </p>
</div>

<script>
  const input = document.getElementById('url');
  const btn = document.getElementById('btn');
  const result = document.getElementById('result');
  const listBody = document.getElementById('list');
  const refreshBtn = document.getElementById('refresh');

  async function create() {
    const longUrl = input.value.trim();

    if (!longUrl) {
      show('err', '请输入网址');
      return;
    }
    if (!/^https?:\/\//i.test(longUrl)) {
      show('err', '网址需要以 http:// 或 https:// 开头');
      return;
    }

    btn.disabled = true;
    btn.textContent = '生成中…';

    try {
      const res = await fetch('/api/links', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ longUrl })
      });
      const json = await res.json();

      if (json.code === 0) {
        const url = escapeHtml(json.data.shortUrl);
        show('ok', '短链接：<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>');
        input.value = '';
        loadList();
      } else {
        show('err', escapeHtml(json.message || '生成失败'));
      }
    } catch (e) {
      show('err', '请求失败：' + escapeHtml(String(e)));
    } finally {
      btn.disabled = false;
      btn.textContent = '生成短链';
    }
  }

  async function loadList() {
    refreshBtn.disabled = true;
    try {
      const res = await fetch('/api/links?page=1&size=8');
      const json = await res.json();

      if (json.code !== 0) {
        listBody.innerHTML = '<tr><td colspan="4" class="empty">加载失败：' + escapeHtml(json.message) + '</td></tr>';
        return;
      }

      const items = json.data.items || [];
      if (items.length === 0) {
        listBody.innerHTML = '<tr><td colspan="4" class="empty">还没有短链，试创建一个</td></tr>';
        return;
      }

      listBody.innerHTML = items.map(function (it) {
        const shortUrl = location.origin + '/' + it.code;
        const status = it.status === 0
                ? '<span class="tag off">已禁用</span>'
                : '<span class="tag">正常</span>';
        const time = it.createdAt ? it.createdAt.replace('T', ' ').slice(0, 16) : '';
        return '<tr>'
                + '<td class="code"><a href="' + escapeHtml(shortUrl) + '" target="_blank" rel="noopener">' + escapeHtml(it.code) + '</a></td>'
                + '<td class="url" title="' + escapeHtml(it.longUrl) + '">' + escapeHtml(it.longUrl) + '</td>'
                + '<td class="status">' + status + '</td>'
                + '<td>' + escapeHtml(time) + '</td>'
                + '</tr>';
      }).join('');
    } catch (e) {
      listBody.innerHTML = '<tr><td colspan="4" class="empty">加载失败：' + escapeHtml(String(e)) + '</td></tr>';
    } finally {
      refreshBtn.disabled = false;
    }
  }

  function show(type, html) {
    result.className = 'result ' + type;
    result.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  btn.addEventListener('click', create);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') create();
  });
  refreshBtn.addEventListener('click', loadList);

  loadList();
</script>
</body>
</html>
